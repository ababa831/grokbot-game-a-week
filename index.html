<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=weeks/2026-w35-hold-orbit/" />
    <title>Game A Week — HOLD ORBIT</title>
    <link rel="canonical" href="weeks/2026-w35-hold-orbit/" />
    <style>
      :root {
        --bg: #070b14;
        --ink: #e8f0ff;
        --mute: #8aa0c0;
        --accent: #3de0c5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse 80% 60% at 50% 40%, #12203a, var(--bg));
        color: var(--ink);
        font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
        text-align: center;
        padding: 24px;
      }
      a {
        color: var(--accent);
        font-weight: 650;
        letter-spacing: 0.06em;
        text-decoration: none;
        border-bottom: 1px solid rgba(61, 224, 197, 0.4);
      }
      a:hover {
        border-bottom-color: var(--accent);
      }
      p {
        color: var(--mute);
        font-size: 14px;
        line-height: 1.6;
      }
      h1 {
        font-size: 28px;
        letter-spacing: 0.08em;
        margin: 0 0 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GAME A WEEK</h1>
      <p>最新週へ移動しています…</p>
      <p><a href="weeks/2026-w35-hold-orbit/">HOLD ORBIT（2026-W35）を開く</a></p>
    </main>
  </body>
</html>
