<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b14" />
    <title>HOLD ORBIT — Game A Week 2026-W35</title>
    <meta
      name="description"
      content="Hold to orbit. Release to slingshot. Survive the drifting field."
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="wrap">
      <canvas id="game" aria-label="HOLD ORBIT game canvas"></canvas>

      <div id="hud" aria-live="polite">
        <div class="hud-block">
          <span class="hud-label">Time</span>
          <span class="hud-value"><span id="time">0.0</span>s</span>
        </div>
        <div class="hud-block">
          <span class="hud-label">Best</span>
          <span class="hud-value"><span id="best">0.0</span>s</span>
        </div>
      </div>

      <div id="overlay">
        <div id="title-panel" class="panel">
          <h1 class="brand">HOLD <span>ORBIT</span></h1>
          <p class="tagline">つかめ。まわれ。はなた。生き延びろ。</p>
          <div class="howto">
            <div><strong>長押し</strong>（Space / クリック / タッチ）で最寄り天体に軌道ロック</div>
            <div><strong>離す</strong>とスリングショット</div>
            <div>惑星・デブリ・崩壊する星にぶつかると終わり</div>
          </div>
          <button type="button" class="cta" id="start-btn">HOLD TO START</button>
          <p class="hint">画面をタップ／クリック、または Space</p>
        </div>

        <div id="over-panel" class="panel hidden">
          <h2 class="over-title">ORBIT LOST</h2>
          <div class="stats">
            生存 <b><span id="over-time">0.0</span>s</b><br />
            ベスト <b><span id="over-best">0.0</span>s</b>
          </div>
          <button type="button" class="cta" id="restart-btn">RESTART</button>
          <p class="hint">R キー、またはタップで再開</p>
        </div>
      </div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
