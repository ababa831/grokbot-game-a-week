<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>返せ — Send Back</title>
    <meta name="description" content="タイミングで弾を打ち返す。敵の弾が敵を倒す。" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button type="button" id="mute-btn" aria-pressed="false">音声オン</button>
    <div id="wrap">
      <div id="hud">
        <div>
          <div style="font-size: 11px; opacity: 0.7; margin-bottom: 4px">たいりょく</div>
          <div class="hp-row" id="hp-row"></div>
        </div>
        <div class="scores">
          <div class="returns">返し <span id="now-returns">0</span></div>
          <div class="wave">WAVE <span id="now-wave">1</span></div>
          <div class="best">最大返し <span id="best-returns">0</span></div>
        </div>
      </div>

      <div id="canvas-frame">
        <canvas id="game" width="720" height="480"></canvas>
        <div id="wave-label">WAVE</div>
        <div id="clear-popup"></div>
        <div id="overlay">
          <div id="overlay-inner"></div>
          <button type="button" id="skip-room-btn" class="skip-room hidden">次へ</button>
        </div>
      </div>

      <div id="hint-bar">
        <span class="reflect">返す クリック / Space / タップ</span>
        <span class="nudge">微移動 ← →</span>
        <span>DEBUG F1–F5</span>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="audio.js"></script>
    <script src="game.js"></script>
  </body>
</html>
