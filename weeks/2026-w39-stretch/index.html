<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>伸ばせ — Stretch</title>
    <meta name="description" content="押し続けて体をゴムのように伸ばす。届かないものを掴み、離すと弾ける。" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button type="button" id="mute-btn" aria-pressed="false">音声オン</button>
    <div id="wrap">
      <div id="hud">
        <div>
          <div style="font-size: 11px; opacity: 0.7; margin-bottom: 4px">たいりょく</div>
          <div class="hp-row" id="hp-row"></div>
        </div>
        <div class="scores">
          <div class="grabs">掴み <span id="now-grabs">0</span></div>
          <div class="best">最高 <span id="best-grabs">0</span></div>
        </div>
      </div>

      <div id="canvas-frame">
        <canvas id="game" width="720" height="480"></canvas>
        <div id="overlay">
          <div id="overlay-inner"></div>
        </div>
      </div>

      <div id="hint-bar">
        <span class="aim">照準 ポインタ</span>
        <span class="stretch">伸ばす ホールド / Space</span>
        <span>DEBUG F1–F2</span>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="audio.js"></script>
    <script src="game.js"></script>
  </body>
</html>
